<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-book-bookmark mr-2"></i>Library System</h1>
        <button onclick="openBookModal()" class="bg-white text-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium shadow"><i class="fa-solid fa-plus"></i> Add Book</button>
    </header>

    <nav class="bg-white border-b px-4 flex gap-6 text-sm font-semibold">
        <button onclick="switchTab('cat')" id="tab-cat-btn" class="py-3 border-b-2 border-indigo-600 text-indigo-600">Catalogue</button>
        <button onclick="switchTab('tx')" id="tab-tx-btn" class="py-3 border-b-2 border-transparent text-slate-500">Issued Books</button>
    </nav>

    <main class="max-w-6xl mx-auto p-4 w-full flex-grow">
        <!-- CATALOGUE TAB -->
        <div id="cat-section" class="space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="search" oninput="render()" placeholder="Search title, author, ISBN..." class="flex-grow p-2 border rounded-lg text-sm">
                <select id="catFilter" onchange="render()" class="p-2 border rounded-lg text-sm bg-white"><option value="">All Categories</option></select>
                <select id="availabilityFilter" onchange="render()" class="p-2 border rounded-lg text-sm bg-white">
                    <option value="">All Status</option>
                    <option value="yes">Available</option>
                    <option value="no">Out of Stock</option>
                </select>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
                        <tr>
                            <th class="p-3">Title & Author</th>
                            <th class="p-3">ISBN</th>
                            <th class="p-3">Category</th>
                            <th class="p-3 text-center">Total / Avail</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookTable" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <!-- TRANSACTIONS TAB -->
        <div id="tx-section" class="hidden space-y-4">
            <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-xs">
                        <tr>
                            <th class="p-3">Book Title</th>
                            <th class="p-3">Borrower</th>
                            <th class="p-3">Dates (Issue / Due)</th>
                            <th class="p-3 text-center">Status</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="txTable" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- BOOK MODAL -->
    <div id="bookModalEl" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <form onsubmit="saveBook(event)" class="bg-white rounded-xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h2 id="modalTitle" class="font-bold text-lg text-indigo-600">Add Book</h2>
            <input type="hidden" id="bookId">
            <input type="text" id="bTitle" placeholder="Book Title *" required class="w-full p-2 border rounded text-sm">
            <input type="text" id="bAuthor" placeholder="Author *" required class="w-full p-2 border rounded text-sm">
            <input type="text" id="bIsbn" placeholder="ISBN *" required class="w-full p-2 border rounded text-sm">
            <input type="text" id="bCategory" placeholder="Category *" required class="w-full p-2 border rounded text-sm">
            <input type="number" id="bQty" placeholder="Total Quantity *" min="1" required class="w-full p-2 border rounded text-sm">
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeBookModal()" class="px-4 py-2 border rounded text-sm">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm font-medium">Save</button>
            </div>
        </form>
    </div>

    <!-- ISSUE MODAL -->
    <div id="issueModalEl" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <form onsubmit="saveIssue(event)" class="bg-white rounded-xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h2 class="font-bold text-lg text-indigo-600">Issue Book</h2>
            <input type="hidden" id="issueBookId">
            <input type="text" id="borrower" placeholder="Borrower Name *" required class="w-full p-2 border rounded text-sm">
            <div>
                <label class="text-xs text-slate-500">Due Date</label>
                <input type="date" id="dueDate" required class="w-full p-2 border rounded text-sm">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeIssueModal()" class="px-4 py-2 border rounded text-sm">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm font-medium">Confirm</button>
            </div>
        </form>
    </div>

    <script>
        let books = JSON.parse(localStorage.getItem('books')) || [
            { id: '1', title: 'Database Concepts', author: 'Silberschatz', isbn: '978-007', category: 'Computer Science', qty: 5, issued: 1 },
            { id: '2', title: 'Clean Code', author: 'Robert Martin', isbn: '978-013', category: 'Software Engineering', qty: 3, issued: 0 }
        ];
        let txs = JSON.parse(localStorage.getItem('txs')) || [
            { id: 't1', bookId: '1', title: 'Database Concepts', borrower: 'Dhanush', issueDate: '2026-10-01', dueDate: '2026-10-15', status: 'Issued' }
        ];

        function persist() {
            localStorage.setItem('books', JSON.stringify(books));
            localStorage.setItem('txs', JSON.stringify(txs));
        }

        function switchTab(t) {
            document.getElementById('cat-section').classList.toggle('hidden', t !== 'cat');
            document.getElementById('tx-section').classList.toggle('hidden', t !== 'tx');
            document.getElementById('tab-cat-btn').className = t === 'cat' ? 'py-3 border-b-2 border-indigo-600 text-indigo-600' : 'py-3 border-b-2 border-transparent text-slate-500';
            document.getElementById('tab-tx-btn').className = t === 'tx' ? 'py-3 border-b-2 border-indigo-600 text-indigo-600' : 'py-3 border-b-2 border-transparent text-slate-500';
            if(t === 'tx') renderTxs(); else render();
        }

        function render() {
            const q = document.getElementById('search').value.toLowerCase();
            const catSelect = document.getElementById('catFilter');
            const cat = catSelect ? catSelect.value : '';
            const av = document.getElementById('availabilityFilter').value;
            
            const cats = [...new Set(books.map(b => b.category))];
            if(catSelect) {
                catSelect.innerHTML = '<option value="">All Categories</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
                catSelect.value = cat;
            }

            const tbody = document.getElementById('bookTable');
            tbody.innerHTML = '';
            
            books.filter(b => {
                const matchQ = b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.isbn.toLowerCase().includes(q);
                const matchC = !cat || b.category === cat;
                const avail = b.qty - b.issued;
                const matchA = !av || (av === 'yes' ? avail > 0 : avail === 0);
                return matchQ && matchC && matchA;
            }).forEach(b => {
                const avail = b.qty - b.issued;
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3"><div class="font-semibold">${b.title}</div><div class="text-xs text-slate-500">by ${b.author}</div></td>
                        <td class="p-3 font-mono text-xs">${b.isbn}</td>
                        <td class="p-3"><span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded text-xs">${b.category}</span></td>
                        <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs ${avail > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${b.qty} total / ${avail} avail</span></td>
                        <td class="p-3 text-right space-x-1">
                            <button onclick="openIssue('${b.id}')" title="Issue" class="p-1.5 bg-emerald-50 text-emerald-600 rounded ${avail <= 0 ? 'opacity-40 cursor-not-allowed' : ''}"><i class="fa-solid fa-share"></i></button>
                            <button onclick="openEdit('${b.id}')" title="Edit" class="p-1.5 bg-blue-50 text-blue-600 rounded"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="delBook('${b.id}')" title="Delete" class="p-1.5 bg-red-50 text-red-600 rounded"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function renderTxs() {
            const tbody = document.getElementById('txTable');
            tbody.innerHTML = '';
            txs.forEach(t => {
                const ret = t.status === 'Returned';
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium">${t.title}</td>
                        <td class="p-3">${t.borrower}</td>
                        <td class="p-3 text-xs text-slate-600">${t.issueDate} &rarr; ${t.dueDate}</td>
                        <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs ${ret ? 'bg-slate-100 text-slate-600' : 'bg-amber-100 text-amber-800'}">${t.status}</span></td>
                        <td class="p-3 text-right">${!ret ? `<button onclick="returnBook('${t.id}')" class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded text-xs font-medium">Return</button>` : '<span class="text-xs text-slate-400">Done</span>'}</td>
                    </tr>`;
            });
        }

        function openBookModal() {
            document.getElementById('modalTitle').innerText = 'Add Book';
            document.getElementById('bookId').value = '';
            document.querySelector('#bookModalEl form').reset();
            document.getElementById('bookModalEl').classList.remove('hidden');
        }
        function openEdit(id) {
            const b = books.find(x => x.id === id);
            if(!b) return;
            document.getElementById('modalTitle').innerText = 'Edit Book';
            document.getElementById('bookId').value = b.id;
            document.getElementById('bTitle').value = b.title;
            document.getElementById('bAuthor').value = b.author;
            document.getElementById('bIsbn').value = b.isbn;
            document.getElementById('bCategory').value = b.category;
            document.getElementById('bQty').value = b.qty;
            document.getElementById('bookModalEl').classList.remove('hidden');
        }
        function closeBookModal() { document.getElementById('bookModalEl').classList.add('hidden'); }

        function saveBook(e) {
            e.preventDefault();
            const id = document.getElementById('bookId').value;
            const title = document.getElementById('bTitle').value;
            const author = document.getElementById('bAuthor').value;
            const isbn = document.getElementById('bIsbn').value;
            const category = document.getElementById('bCategory').value;
            const qty = parseInt(document.getElementById('bQty').value);

            if(id) {
                const b = books.find(x => x.id === id);
                if(qty < b.issued) { alert('Qty cannot be less than issued copies.'); return; }
                Object.assign(b, { title, author, isbn, category, qty });
            } else {
                books.push({ id: Date.now().toString(), title, author, isbn, category, qty, issued: 0 });
            }
            persist(); closeBookModal(); render();
        }

        function delBook(id) {
            const b = books.find(x => x.id === id);
            if(b.issued > 0) { alert('Cannot delete book with active issued copies.'); return; }
            if(confirm('Delete this book?')) { books = books.filter(x => x.id !== id); persist(); render(); }
        }

        function openIssue(id) {
            const b = books.find(x => x.id === id);
            if(b.qty - b.issued <= 0) { alert('Out of stock!'); return; }
            document.getElementById('issueBookId').value = id;
            document.getElementById('borrower').value = '';
            document.getElementById('dueDate').value = new Date(Date.now() + 14*86400000).toISOString().split('T')[0];
            document.getElementById('issueModalEl').classList.remove('hidden');
        }
        function closeIssueModal() { document.getElementById('issueModalEl').classList.add('hidden'); }

        function saveIssue(e) {
            e.preventDefault();
            const id = document.getElementById('issueBookId').value;
            const borrower = document.getElementById('borrower').value;
            const dueDate = document.getElementById('dueDate').value;
            const b = books.find(x => x.id === id);
            
            if(b.qty - b.issued <= 0) { alert('Out of stock!'); closeIssueModal(); return; }
            b.issued++;
            txs.unshift({ id: 't' + Date.now(), bookId: id, title: b.title, borrower, issueDate: new Date().toISOString().split('T')[0], dueDate, status: 'Issued' });
            persist(); closeIssueModal(); render(); alert('Book issued successfully!');
        }

        function returnBook(txId) {
            const t = txs.find(x => x.id === txId);
            if(!t || t.status === 'Returned') return;
            const b = books.find(x => x.id === t.bookId);
            if(b) b.issued = Math.max(0, b.issued - 1);
            t.status = 'Returned';
            persist(); renderTxs(); alert('Book returned successfully.');
        }

        window.onload = render;
    </script>
</body>
</html>
